<div id="kt_app_header" class="app-header">
    <div class="app-container container-fluid d-flex align-items-stretch flex-stack" id="kt_app_header_container">
        <div class="d-flex align-items-center d-block d-lg-none ms-n3" title="Show sidebar menu">
            <div class="btn btn-icon btn-active-color-primary w-35px h-35px me-2" id="kt_app_sidebar_mobile_toggle">
                <i class="ki-outline ki-abstract-14 fs-2"></i>
            </div>
            <a [routerLink]="['/anasayfa']">
                <img alt="Logo" src="assets/image/neu_logo_net.png" class="h-30px" />
            </a>
        </div>
        <div class="app-navbar flex-lg-grow-1" id="kt_app_header_navbar">
            <div class="app-navbar-item d-flex align-items-stretch flex-lg-grow-1">
                <div id="kt_header_search" class="header-search d-flex align-items-center w-lg-200px"
                    data-kt-search-keypress="true" data-kt-search-min-length="2" data-kt-search-enter="enter"
                    data-kt-search-layout="menu" data-kt-search-responsive="true" data-kt-menu-trigger="auto"
                    data-kt-menu-permanent="true" data-kt-menu-placement="bottom-start">
                    <div data-kt-search-element="toggle"
                        class="search-toggle-mobile d-flex d-lg-none align-items-center">
                    </div>


                </div>
            </div>

            <div class="app-navbar-item ms-1 ms-md-3 d-flex align-items-center" id="kt_header_user_menu_toggle">
                <!-- Kullanıcı İsmi (Avatarın Solunda) -->
                <div class="d-none d-md-block me-2 text-end">
                    <div class="fw-semibold text-gray-800 fs-6">{{ kullanici.adisoyadi }}</div>
                    <div class="text-muted fs-8" *appYetki="'Uye.Standart'">Mezun</div>
                    <div class="text-muted fs-8" *appYetki="'Mezun.Yetkili'">Sorumlu</div>
                </div>

                <!-- Avatar Tetikleyici -->
                <div class="cursor-pointer symbol symbol-circle symbol-35px symbol-md-45px"
                    data-kt-menu-trigger="{default: 'click', lg: 'hover'}" data-kt-menu-attach="parent"
                    data-kt-menu-placement="bottom-end" aria-haspopup="true" aria-expanded="false"
                    title="Kullanıcı Menüsü">
                    <img src="assets/media/avatars/blank.png" alt="Kullanıcı Avatarı" />
                </div>

                <!-- Açılır Menü -->
                <div class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-800 menu-state-bg menu-state-color fw-semibold py-4 fs-6 w-275px shadow"
                    data-kt-menu="true">

                    <!-- Kullanıcı Bilgileri -->
                    <div class="menu-item px-3">
                        <div class="menu-content d-flex align-items-center px-3">
                            <div class="symbol symbol-50px me-4">
                                <img src="assets/media/avatars/blank.png" alt="Kullanıcı" />
                            </div>
                            <div class="d-flex flex-column">
                                <div class="fw-bold d-flex align-items-center fs-5">
                                    {{ kullanici.adisoyadi }}
                                    <!-- <span class="badge badge-light-success fw-bold fs-8 px-2 py-1 ms-2">AKTİF</span> -->
                                </div>
                                <span *appYetki="'Uye.Standart'" class="fw-semibold text-muted fs-7">MEZUN</span>
                                <span *appYetki="'Mezun.Genel'" class="fw-semibold text-muted fs-7">SORUMLU</span>
                            </div>
                        </div>
                    </div>

                    <ng-container *appYetki="'Uye.Standart'">
                        <div class="separator my-2"></div>
                        <!--end::Menu separator-->
                        <!--begin::Menu item-->
                        <div class="menu-item px-5">
                            <a [routerLink]="['uye-profil-islem']"
                                class="menu-link d-flex align-items-center justify-content-center">
                                <i class="fa-solid fa-user text-primary fs-6 me-2"></i>
                                <span>Profil Bilgilerim</span>
                            </a>
                        </div>
                    </ng-container>
                    <div class="separator my-3 opacity-75"></div>

                    <!-- Çıkış Butonu -->
                    <div class="menu-item px-5">
                        <button (click)="cikis()"
                            class="menu-link btn btn-sm btn-outline-primary w-100 d-flex align-items-center justify-content-center gap-2"
                            style="font-weight: 600; font-size: 1.05rem;">
                            <i class="fas fa-sign-out-alt text-danger" style="font-size: 1.2rem;"></i>
                            <span>Çıkış</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="app-navbar-separator separator d-none d-lg-flex"></div>
    </div>
</div>
<div id="kt_scrolltop" class="scrolltop" data-kt-scrolltop="true">
    <i class="ki-outline ki-arrow-up"></i>
</div>
